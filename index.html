<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<meta name="description" content="A Christmas village that only opens for Yera noona.">
<title>A Village That Only Opens at Christmas</title>
<meta property="og:title" content="A Village That Only Opens at Christmas">
<meta property="og:description" content="A Christmas letter, sealed in snow. For Yera noona.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap"></noscript>
<link rel="stylesheet" href="./styles.css?v=6">
<style>
  body.pre-walk #overlays > div:not(#intro) {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
</style>
</head>
<body class="pre-walk">

<!-- scroll distance that drives the walk -->
<div id="walk-space" aria-hidden="true"></div>

<canvas id="gl" aria-label="A snowy Christmas village at night"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div id="overlays" aria-live="polite">

  <!-- arrival cinematic -->
  <div id="intro" class="screen">
    <div class="intro-inner">
      <div class="intro-kicker">A Christmas letter, sealed in snow</div>
      <h1 class="intro-title">For Yera&nbsp;noona</h1>
      <div class="intro-hangul" lang="ko">예라 누나</div>
      <div class="intro-sub">A village that only opens at Christmas</div>
    </div>
    <button id="walk-in" class="walk-in" type="button">Walk in</button>
  </div>

  <!-- per-stop world cards are created by app.js -->

</div>

<!-- persistent HUD -->
<div id="hud">
  <button id="mute" class="mute" type="button" aria-label="Sound on or off" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l8-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="14.5" cy="16" r="2.5"></circle>
    </svg>
    <span class="mute-line"></span>
  </button>
  <nav id="dots" aria-label="Village stops"></nav>
  <button id="chevron" class="chevron" type="button" aria-label="Walk forward">
    <span id="chevron-label">Walk in</span>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>
  </button>
  <div id="toasts" aria-live="polite"></div>
</div>

<div id="letterbox" class="letterbox" aria-hidden="true">
  <div class="letterbox-note">
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#e8d3a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="7.75" y="3.5" width="8.5" height="17" rx="2.2"></rect>
      <line x1="10.75" y1="18.4" x2="13.25" y2="18.4"></line>
    </svg>
    <span>Turn the phone up</span>
  </div>
</div>

<div id="reduced-note" class="reduced-note" hidden>
  Quiet mode is on — the village waits as still frames between stops.
</div>

<script type="module" src="./app.js?v=6"></script>
</body>
</html>
